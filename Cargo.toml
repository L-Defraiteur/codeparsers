[package]
name = "codeparsers"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Extraction de scopes multi-langages par tree-sitter : ce qu'on comprend, et ce qu'on n'a pas su comprendre — dit plutôt que jeté."
repository = "https://github.com/L-Defraiteur/codeparsers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1"
regex = "1"
pathdiff = "0.2"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23.4"
# **Plus d'épingle depuis tree-sitter 0.27** (25 octobre 2026), qui lit l'ABI 15 : 0.23.5,
# compilée en ABI 15, faisait paniquer l'analyse de tout `.cs` sous 0.24, et codeparsers
# l'épinglait à `=0.23.1`. `tests/grammaires.rs` vérifie que chaque grammaire liée se charge.
tree-sitter-c-sharp = "0.23.5"
# **La grammaire bash, pour décider — pas pour indexer.**
#
# Elle sert à `shell::decomposer`, qui réduit une ligne de commande en argv
# afin qu'une politique puisse la juger. Elle est ici et pas dans rag3weaver
# parce qu'une seule place lie des grammaires tree-sitter : deux voudraient
# dire deux runtimes C à garder en phase, et on s'est fait avoir le 29 août
# par une extension construite contre un autre cœur.
#
# **C'est l'ABI qui décide, pas Cargo.** Les grammaires n'exigent que `tree-sitter-language
# ^0.1` côté dépendances : une grammaire en ABI 15 s'installait à côté de tree-sitter 0.24, qui
# la refusait à l'exécution (« Incompatible language version 15 », 30 août 2026). Depuis
# tree-sitter 0.27 (25 octobre 2026), qui lit l'ABI 15, bash suit sa dernière version ; le test
# `tests/grammaires.rs` garde la règle.
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
# Copie locale : le build.rs publié force un drapeau GCC que MSVC refuse
# (vendor/tree-sitter-scss/VENDOR.md).
tree-sitter-scss = { path = "vendor/tree-sitter-scss" }
indexmap = "2"
blake3 = "1"
rayon = "1"
