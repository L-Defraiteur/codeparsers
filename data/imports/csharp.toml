# Les règles d'import de C# (codeparsers, `import_resolution::regles`).
# Un fichier `csharp.toml` dans `import_rules_dir` remplace ce fichier entier.
# Provenance : les espaces de noms du navigateur d'API .NET, un fichier `xml/ns-<espace>.xml` par espace
# dans le dépôt de la documentation officielle `dotnet/dotnet-api-docs` (branche main, commit a010100 du
# 11 nov. 2026), relus le 14 nov. 2026 : 417 espaces `System.*`, `Microsoft.*`, `Accessibility` et
# `UIAutomationClientsideProviders` (.NET, .NET Framework, Microsoft.Extensions). Retirés comme hors de la
# plateforme : OpenAI.* (4), Polly, Windows.* (11 : WinRT et Win32). ASP.NET Core et Entity Framework Core
# ne sont pas dans ce dépôt (des paquets NuGet, documentés ailleurs) : ils ne sont pas builtin. À relire :
# `gh api repos/dotnet/dotnet-api-docs/git/trees/main:xml --jq '.tree[].path' | grep '^ns-'`.
langue = "csharp"
extensions = ["cs"]

[builtin]
source = "dotnet/dotnet-api-docs xml/ns-*.xml, commit a010100 du 11 nov. 2026 (417 espaces de noms)"
# Un espace de noms de la liste, ou l'un de ses enfants (`System.Text.Json.Serialization`).
