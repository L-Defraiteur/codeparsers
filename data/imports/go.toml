# Les règles d'import de Go (codeparsers, `import_resolution::regles`).
# Un fichier `go.toml` dans `import_rules_dir` remplace ce fichier entier.
# Provenance : la règle de la chaîne d'outils de Go (`go help importpath`, relue le 14 nov. 2026) — un
# chemin dont le premier élément n'a pas de point est la bibliothèque standard (`net/http`) ; un module
# tiers commence par un domaine (`github.com/…`). Pas de liste : une règle nommée.
langue = "go"
extensions = ["go"]

[builtin]
regle = "premier_segment_sans_point"

[local]
prefixes = ["./", "../"]

[nom_de_paquet]
separateur = "/"
# Le module est le plus long préfixe déclaré du chemin importé (`github.com/x/y/sub` → `github.com/x/y`
# quand go.mod requiert `github.com/x/y`).
regle = "plus_long_prefixe_declare"
# Pas de variantes : un chemin de module Go distingue la casse et les tirets
# (`github.com/Azure/azure-sdk-for-go` n'est pas `github.com/azure/azure-sdk-for-go`). Les noms de
# `declared_dependencies_by_language["go"]` se comparent tels quels ; ceux de `declared_dependencies`
# (toutes langues), minuscules et tirets confondus, se comparent au nom normalisé de la même façon.
