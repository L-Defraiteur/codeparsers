# Les règles d'import de Python (codeparsers, 14 novembre 2026).
#
# Ce fichier dit, pour un import Python, s'il vient de la bibliothèque standard, s'il est local au dépôt,
# et quel nom de paquet il désigne (à comparer aux manifestes du dépôt). Il est compilé dans codeparsers
# comme défaut ; un fichier du même nom dans le dossier `import_rules_dir` le remplace en entier, sans
# recompiler (docs/codeparsers/14-11-2026/02-du-nom-importe-au-paquet.md, rag3db).
#
# Provenance : `sys.stdlib_module_names` de Python 3.14.9, relu le 14 nov. 2026 (297 noms).
# À relire à chaque version de Python : `python3 -c 'import sys; print(sorted(sys.stdlib_module_names))'`.

langue = "python"
extensions = ["py", "pyi"]

[builtin]
source = "sys.stdlib_module_names, Python 3.14.9"
noms = [
   "__future__", "_abc", "_aix_support", "_android_support", "_apple_support", "_ast",
   "_ast_unparse", "_asyncio", "_bisect", "_blake2", "_bz2", "_codecs", "_codecs_cn", "_codecs_hk",
   "_codecs_iso2022", "_codecs_jp", "_codecs_kr", "_codecs_tw", "_collections", "_collections_abc",
   "_colorize", "_compat_pickle", "_contextvars", "_csv", "_ctypes", "_curses", "_curses_panel",
   "_datetime", "_dbm", "_decimal", "_elementtree", "_frozen_importlib",
   "_frozen_importlib_external", "_functools", "_gdbm", "_hashlib", "_heapq", "_hmac", "_imp",
   "_interpchannels", "_interpqueues", "_interpreters", "_io", "_ios_support", "_json", "_locale",
   "_lsprof", "_lzma", "_markupbase", "_md5", "_multibytecodec", "_multiprocessing", "_opcode",
   "_opcode_metadata", "_operator", "_osx_support", "_overlapped", "_pickle", "_posixshmem",
   "_posixsubprocess", "_py_abc", "_py_warnings", "_pydatetime", "_pydecimal", "_pyio", "_pylong",
   "_pyrepl", "_queue", "_random", "_remote_debugging", "_scproxy", "_sha1", "_sha2", "_sha3",
   "_signal", "_sitebuiltins", "_socket", "_sqlite3", "_sre", "_ssl", "_stat", "_statistics",
   "_string", "_strptime", "_struct", "_suggestions", "_symtable", "_sysconfig", "_thread",
   "_threading_local", "_tkinter", "_tokenize", "_tracemalloc", "_types", "_typing", "_uuid",
   "_warnings", "_weakref", "_weakrefset", "_winapi", "_wmi", "_zoneinfo", "_zstd", "abc",
   "annotationlib", "antigravity", "argparse", "array", "ast", "asyncio", "atexit", "base64", "bdb",
   "binascii", "bisect", "builtins", "bz2", "cProfile", "calendar", "cmath", "cmd", "code",
   "codecs", "codeop", "collections", "colorsys", "compileall", "compression", "concurrent",
   "configparser", "contextlib", "contextvars", "copy", "copyreg", "csv", "ctypes", "curses",
   "dataclasses", "datetime", "dbm", "decimal", "difflib", "dis", "doctest", "email", "encodings",
   "ensurepip", "enum", "errno", "faulthandler", "fcntl", "filecmp", "fileinput", "fnmatch",
   "fractions", "ftplib", "functools", "gc", "genericpath", "getopt", "getpass", "gettext", "glob",
   "graphlib", "grp", "gzip", "hashlib", "heapq", "hmac", "html", "http", "idlelib", "imaplib",
   "importlib", "inspect", "io", "ipaddress", "itertools", "json", "keyword", "linecache", "locale",
   "logging", "lzma", "mailbox", "marshal", "math", "mimetypes", "mmap", "modulefinder", "msvcrt",
   "multiprocessing", "netrc", "nt", "ntpath", "nturl2path", "numbers", "opcode", "operator",
   "optparse", "os", "pathlib", "pdb", "pickle", "pickletools", "pkgutil", "platform", "plistlib",
   "poplib", "posix", "posixpath", "pprint", "profile", "pstats", "pty", "pwd", "py_compile",
   "pyclbr", "pydoc", "pydoc_data", "pyexpat", "queue", "quopri", "random", "re", "readline",
   "reprlib", "resource", "rlcompleter", "runpy", "sched", "secrets", "select", "selectors",
   "shelve", "shlex", "shutil", "signal", "site", "smtplib", "socket", "socketserver", "sqlite3",
   "sre_compile", "sre_constants", "sre_parse", "ssl", "stat", "statistics", "string", "stringprep",
   "struct", "subprocess", "symtable", "sys", "sysconfig", "syslog", "tabnanny", "tarfile",
   "tempfile", "termios", "textwrap", "this", "threading", "time", "timeit", "tkinter", "token",
   "tokenize", "tomllib", "trace", "traceback", "tracemalloc", "tty", "turtle", "turtledemo",
   "types", "typing", "unicodedata", "unittest", "urllib", "uuid", "venv", "warnings", "wave",
   "weakref", "webbrowser", "winreg", "winsound", "wsgiref", "xml", "xmlrpc", "zipapp", "zipfile",
   "zipimport", "zlib", "zoneinfo",
]

[local]
# `from . import x`, `from .outils import f`
prefixes = ["."]

[nom_de_paquet]
# `requests.adapters` → `requests`
separateur = "."
garder = 1
# `PyYAML` et `pyyaml`, `typing-extensions` et `typing_extensions` se comparent égaux. Le paquet
# `PyYAML` qui fournit le module `yaml` ne se déduit pas : c'est la table déclarée du dépôt.
variantes = ["tiret_souligne", "casse"]

# **Les distributions dont le module importé porte un autre nom** (`PyYAML` s'importe `yaml`) : un nom de
# manifeste (pyproject, requirements) se compare aussi aux modules qu'il fournit.
# Source : la table de pipreqs (`bndr/pipreqs`, `pipreqs/mapping`, commit 48dbafd du 1er mars 2026,
# licence Apache-2.0, attribution gardée), 1081 distributions ; relue le 14 nov. 2026. À relire :
# `gh api 'repos/bndr/pipreqs/contents/pipreqs/mapping' --jq .content | base64 -d` (lignes `module:distribution`).
# Plus, à la fin, 13 renommages absents de pipreqs et vus dans `importlib.metadata.packages_distributions()`
# de Python 3.14.10 au portable, le même jour (le témoin croisé).
